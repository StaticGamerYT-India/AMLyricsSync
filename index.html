<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Mp3tag - Apple Music ID Injector</title>
    <!-- Include browser-id3-writer for writing tags directly in browser -->
    <script src="https://cdn.jsdelivr.net/npm/browser-id3-writer@4.4.0/dist/browser-id3-writer.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #f0f0f0; max-width: 800px; margin: 30px auto; padding: 20px; }
        h2 { color: #fa233b; text-align: center; }
        .dropzone { border: 2px dashed #444; padding: 30px; text-align: center; border-radius: 12px; background: #181818; cursor: pointer; margin-bottom: 20px; }
        .dropzone:hover { border-color: #fa233b; }
        .track-card { background: #1e1e1e; padding: 15px; margin-top: 10px; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        input, button { padding: 10px; border-radius: 6px; border: none; font-size: 14px; }
        input[type="text"] { background: #2a2a2a; color: #fff; border: 1px solid #444; width: 60%; }
        button { background: #fa233b; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #d91c32; }
        .search-results { margin-top: 10px; max-height: 200px; overflow-y: auto; background: #161616; border-radius: 6px; padding: 5px; }
        .search-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #222; font-size: 13px; }
        .search-item:hover { background: #252525; color: #fa233b; }
        .tag-status { color: #4cd964; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

    <h2>Web Mp3tag : Apple Music ID Injector</h2>
    
    <div class="dropzone" id="dropzone">
        <p>📂 Drag & Drop your Music File (.mp3, .m4a, .mp4) here, or click to select</p>
        <input type="file" id="fileInput" accept=".mp3,.m4a,.mp4" style="display: none;">
    </div>

    <div id="workspace" style="display: none;">
        <div class="track-card">
            <div>
                <strong id="fileName">file.mp3</strong>
                <div style="font-size: 12px; color: #888;" id="fileSize">0 MB</div>
            </div>
            <div id="status" class="tag-status">Ready to tag</div>
        </div>

        <h3>1. Search Apple Music Catalog</h3>
        <input type="text" id="searchQuery" placeholder="Search track/artist (e.g., Tere Bina A.R. Rahman)">
        <button onclick="searchAppleMusic()">Search</button>
        
        <div id="searchResults" class="search-results" style="display: none;"></div>

        <h3 style="margin-top: 20px;">2. Selected Catalog ID</h3>
        <input type="text" id="catalogIdInput" placeholder="Catalog ID will appear here">
        <button onclick="injectTagAndDownload()" style="background: #4cd964; color: #000;">Inject & Download File</button>
    </div>

    <script>
        let selectedFile = null;
        let fileBuffer = null;
        let ffmpegResources = null;

        function getFileExtension(fileName) {
            const dotIndex = fileName.lastIndexOf('.');
            if (dotIndex === -1) return '';
            return fileName.slice(dotIndex).toLowerCase();
        }

        async function getFfmpegResources() {
            if (ffmpegResources) return ffmpegResources;

            const ffmpegModule = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
            const utilModule = await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');

            const ffmpeg = new ffmpegModule.FFmpeg();
            const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
            const workerBaseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm';

            await ffmpeg.load({
                coreURL: await utilModule.toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                wasmURL: await utilModule.toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                workerURL: await utilModule.toBlobURL(`${workerBaseURL}/worker.js`, 'text/javascript')
            });

            ffmpegResources = { ffmpeg, fetchFile: utilModule.fetchFile };
            return ffmpegResources;
        }

        async function injectMp4LikeTagAndDownload(catalogId, fileExt) {
            const statusEl = document.getElementById('status');
            statusEl.innerText = 'Processing MP4/M4A...';

            const { ffmpeg, fetchFile } = await getFfmpegResources();
            const inputName = `input${fileExt}`;
            const outputName = `output${fileExt}`;

            await ffmpeg.writeFile(inputName, await fetchFile(selectedFile));
            await ffmpeg.exec([
                '-i',
                inputName,
                '-c',
                'copy',
                '-metadata',
                `ITUNESCATALOGID=${catalogId}`,
                outputName
            ]);

            const outputData = await ffmpeg.readFile(outputName);
            const mimeType = fileExt === '.mp4' ? 'video/mp4' : 'audio/mp4';
            const taggedBlob = new Blob([outputData.buffer], { type: mimeType });

            try {
                await ffmpeg.deleteFile(inputName);
                await ffmpeg.deleteFile(outputName);
            } catch (cleanupErr) {
                // Best-effort cleanup in FFmpeg virtual FS.
            }

            downloadBlob(taggedBlob, selectedFile.name);
            statusEl.innerText = 'Successfully Tagged & Downloaded!';
        }

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        dropzone.ondragover = (e) => e.preventDefault();
        dropzone.ondrop = (e) => {
            e.preventDefault();
            handleFile(e.dataTransfer.files[0]);
        };

        function handleFile(file) {
            if (!file) return;
            selectedFile = file;
            document.getElementById('fileName').innerText = file.name;
            document.getElementById('fileSize').innerText = (file.size / (1024*1024)).toFixed(2) + ' MB';
            document.getElementById('workspace').style.display = 'block';
            
            // Pre-fill search query with filename stripped of extension
            document.getElementById('searchQuery').value = file.name.replace(/\.[^/.]+$/, "");

            const reader = new FileReader();
            reader.onload = function(e) {
                fileBuffer = e.target.result;
            };
            reader.readAsArrayBuffer(file);
        }

        async function searchAppleMusic() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return;

            const resDiv = document.getElementById('searchResults');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "<div class='search-item'>Searching Apple servers...</div>";

            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=6`);
                const data = await response.json();

                if (data.results.length === 0) {
                    resDiv.innerHTML = "<div class='search-item'>No results found.</div>";
                    return;
                }

                resDiv.innerHTML = "";
                data.results.forEach(track => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    div.innerHTML = `<strong>${track.trackName}</strong> — ${track.artistName} <span style="color:#888;">(ID: ${track.trackId})</span>`;
                    div.onclick = () => {
                        document.getElementById('catalogIdInput').value = track.trackId;
                        resDiv.style.display = 'none';
                    };
                    resDiv.appendChild(div);
                });
            } catch (err) {
                resDiv.innerHTML = "<div class='search-item'>Network error querying Apple API.</div>";
            }
        }

        async function injectTagAndDownload() {
            const catalogId = document.getElementById('catalogIdInput').value;
            if (!catalogId) {
                alert('Please select or enter a Catalog ID first!');
                return;
            }

            const fileExt = getFileExtension(selectedFile.name);

            if (fileExt === '.mp3') {
                try {
                    // Using browser-id3-writer to write custom TXXX user tags (ITUNESCATALOGID)
                    const writer = new ID3Writer(fileBuffer);
                    writer.setFrame('TXXX', {
                        description: 'ITUNESCATALOGID',
                        value: catalogId
                    });
                    writer.addTag();
                    
                    const taggedBlob = writer.getBlob();
                    downloadBlob(taggedBlob, selectedFile.name);
                    document.getElementById('status').innerText = "Successfully Tagged & Downloaded!";
                } catch (e) {
                    alert('Error writing MP3 tags: ' + e.message);
                }
            } else if (fileExt === '.m4a' || fileExt === '.mp4') {
                try {
                    await injectMp4LikeTagAndDownload(catalogId, fileExt);
                } catch (e) {
                    alert('Error writing MP4/M4A tags: ' + e.message);
                    document.getElementById('status').innerText = 'Tagging failed';
                }
            } else {
                alert('Unsupported file format for direct browser tagging.');
            }
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
